[build-system]
requires = ["setuptools>=65,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cuvslam-tools"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "av",
    "jinja2",
    "matplotlib",
    "numpy==2.2.3",
    "scipy==1.15.3",
    "opencv-python==4.11.0.86",
    "pandas",
    "pillow==12.2.0",
    "pyarrow",
    "pydantic",
    "pytransform3d==3.8.0",
    "pyyaml",
    "rerun-sdk",
    "rosbags==0.11.0",
]

[project.optional-dependencies]
pdf = [
    "weasyprint>=60.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
"cuvslam_tools.bag2edex" = ["configs/*.yaml"]
"cuvslam_tools.undistort" = ["input.edex", "input.png"]
"cuvslam_tools.dataset_preparation.coda" = ["download_*.sh"]
"cuvslam_tools.dataset_preparation.kitti" = ["download_*.sh"]
"cuvslam_tools.dataset_preparation.euroc" = ["download_*.sh"]
"cuvslam_tools.dataset_preparation.tartan.dataset_converter" = ["cfg/*.json"]
"cuvslam_tools.dataset_preparation.tum" = ["download_*.sh"]
"cuvslam_tools.dataset_preparation.icl_nuim" = ["download_*.sh"]
"cuvslam_tools.reporter" = ["report_templates/*.html"]
"cuvslam_tools.datasets_validator" = ["configs/*.cfg"]

[project.scripts]
rosbag_extract_edex = "cuvslam_tools.bag2edex.scripts.extract_edex:main"
rosbag_extract_images = "cuvslam_tools.bag2edex.scripts.extract_images:main"
rosbag_extract_urdf = "cuvslam_tools.bag2edex.scripts.extract_urdf:main"
rosbag_extract_videos = "cuvslam_tools.bag2edex.scripts.extract_videos:main"
undistort_edex_images = "cuvslam_tools.undistort.undistort:main"
prepare_kitti = "cuvslam_tools.dataset_preparation.kitti.prepare:main"
prepare_coda = "cuvslam_tools.dataset_preparation.coda.prepare:main"
prepare_euroc = "cuvslam_tools.dataset_preparation.euroc.prepare:main"
prepare_tartan = "cuvslam_tools.dataset_preparation.tartan.prepare:main"
prepare_tum = "cuvslam_tools.dataset_preparation.tum.prepare:main"
prepare_icl_nuim = "cuvslam_tools.dataset_preparation.icl_nuim.prepare:main"
cuvslam_tracker = "cuvslam_tools.tracker.cli:main"
cuvslam_reporter = "cuvslam_tools.reporter.cli:main"
cuvslam_validator = "cuvslam_tools.datasets_validator.cli:main"

[tool.ruff.lint.per-file-ignores]
# PT027 rewrites assertRaises into pytest.raises. These tests run under
# python3 -m unittest and the package does not depend on pytest.
"cuvslam_tools/tests/test_coda_conversion.py" = ["PT027"]
