name: Retry lost runner

# Re-runs the failed jobs of a CI run when a self-hosted runner lost contact with
# GitHub mid-job, and reports every such event. This workflow never checks out
# or executes code from the run it inspects.

on:
  workflow_run:
    workflows: ["Nightly Build & Test"]
    types: [completed]
    branches: [main, "release/**"]

concurrency:
  group: retry-lost-runner-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Total attempts per run, including the original one.
  MAX_ATTEMPTS: 3
  LOST_RUNNER_MESSAGE: "lost communication with the server"
  TRACKING_ISSUE_LABEL: ci-runner-lost
  TRACKING_ISSUE_TITLE: "CI: self-hosted runner lost communication"

jobs:
  retry:
    name: Retry if a runner was lost
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      issues: write
    steps:
      - name: Inspect run, re-run, and notify
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const attempt = run.run_attempt;
            const maxAttempts = Number(process.env.MAX_ATTEMPTS);

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner, repo, run_id: run.id, attempt_number: attempt, per_page: 100,
            });

            const lost = [];
            for (const job of jobs.filter(j => j.conclusion === 'failure')) {
              const annotations = await github.paginate(github.rest.checks.listAnnotations, {
                owner, repo, check_run_id: job.id, per_page: 100,
              });
              if (annotations.some(a => (a.message || '').includes(process.env.LOST_RUNNER_MESSAGE))) {
                lost.push(job);
              }
            }

            if (lost.length === 0) {
              core.info(`Run ${run.id} attempt ${attempt} failed without a lost runner; nothing to do.`);
              return;
            }

            let action;
            let rerunError = null;
            if (attempt >= maxAttempts) {
              action = `Not retried: attempt ${attempt} of ${maxAttempts} was the last one allowed.`;
            } else {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
                action = `Re-ran failed jobs as attempt ${attempt + 1} of ${maxAttempts}.`;
              } catch (error) {
                rerunError = error;
                action = `Re-run request failed: ${error.message}`;
              }
            }

            const runUrl = `${run.html_url}/attempts/${attempt}`;
            const jobLines = lost.map(j => `- [${j.name}](${j.html_url}) on runner \`${j.runner_name || 'unknown'}\``);
            const header = `**${run.name}** on \`${run.head_branch}\` (${run.event}), [attempt ${attempt}](${runUrl})`;
            const body = [header, '', 'Runner lost communication in:', ...jobLines, '', action].join('\n');

            await core.summary.addRaw(body).write();

            const { data: openIssues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: process.env.TRACKING_ISSUE_LABEL, per_page: 1,
            });
            if (openIssues.length > 0) {
              await github.rest.issues.createComment({ owner, repo, issue_number: openIssues[0].number, body });
            } else {
              await github.rest.issues.create({
                owner, repo,
                title: process.env.TRACKING_ISSUE_TITLE,
                labels: [process.env.TRACKING_ISSUE_LABEL],
                body: [
                  'Each comment records a CI job whose self-hosted runner lost communication with GitHub.',
                  'Subscribe to this issue to be notified. Close it to start a fresh one on the next event.',
                  '',
                  '---',
                  '',
                  body,
                ].join('\n'),
              });
            }

            if (rerunError) {
              core.setFailed(action);
            }
