name: Retry lost runner

# Re-runs the failed jobs of a CI run when a self-hosted runner lost contact with
# GitHub mid-job, and reports every such event. This workflow never checks out
# or executes code from the run it inspects.

# A `branches` filter would match PR Verify runs against the PR head branch,
# which a fork can name `main`, so the job condition does the filtering.
on:
  workflow_run:
    workflows: ["Nightly Build & Test", "PR Verify"]
    types: [completed]

permissions: {}

concurrency:
  group: retry-lost-runner-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # Total attempts per run, including the original one.
  MAX_ATTEMPTS: 3
  LOST_RUNNER_MESSAGE: "lost communication with the server"
  TRACKING_ISSUE_LABEL: ci-runner-lost
  TRACKING_ISSUE_TITLE: "CI: self-hosted runner lost communication"

jobs:
  retry:
    name: Retry if a runner was lost
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.name == 'Nightly Build & Test' &&
        (github.event.workflow_run.head_branch == 'main' ||
         startsWith(github.event.workflow_run.head_branch, 'release/'))) ||
       (github.event.workflow_run.name == 'PR Verify' &&
        github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      checks: read
      issues: write
      pull-requests: read
    steps:
      - name: Inspect run, re-run, and notify
        uses: actions/github-script@v7
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.CI_ALERT_SLACK_WEBHOOK_URL }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const attempt = run.run_attempt;
            const maxAttempts = Number(process.env.MAX_ATTEMPTS);

            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner, repo, run_id: run.id, attempt_number: attempt, per_page: 100,
            });

            const lost = [];
            for (const job of jobs.filter(j => j.conclusion === 'failure')) {
              const annotations = await github.paginate(github.rest.checks.listAnnotations, {
                owner, repo, check_run_id: job.id, per_page: 100,
              });
              if (annotations.some(a => (a.message || '').includes(process.env.LOST_RUNNER_MESSAGE))) {
                lost.push(job);
              }
            }

            if (lost.length === 0) {
              core.info(`Run ${run.id} attempt ${attempt} failed without a lost runner; nothing to do.`);
              return;
            }

            const isPrRun = run.event === 'pull_request';
            const pr = (run.pull_requests || [])[0];
            let prState = null;
            let prCheckError = null;
            if (isPrRun && !pr) {
              prCheckError = 'the run lists no pull request';
            } else if (pr) {
              try {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pr.number });
                prState = data.state;
              } catch (error) {
                prCheckError = error.message;
                core.warning(`Could not read PR #${pr.number}: ${error.message}`);
              }
            }

            // Both workflows cancel in-progress runs of their concurrency group, so
            // re-running a superseded run would cancel the newer one. The branch query
            // matches by name only, so it can also return fork runs and runs of other
            // PRs from a same-named branch; PR Verify's group is the PR number.
            let newerRun = null;
            let newerRunError = null;
            try {
              const { data: recent } = await github.rest.actions.listWorkflowRuns({
                owner, repo, workflow_id: run.workflow_id, branch: run.head_branch, per_page: 20,
              });
              const sameRepo = r => (r.head_repository || {}).full_name === run.head_repository.full_name;
              const samePr = r => !isPrRun || (r.pull_requests || []).some(p => pr && p.number === pr.number);
              newerRun = recent.workflow_runs.find(
                r => r.id !== run.id && r.created_at > run.created_at && sameRepo(r) && samePr(r));
            } catch (error) {
              newerRunError = error.message;
              core.warning(`Could not check for a newer run: ${error.message}`);
            }

            let action;
            let rerunError = null;
            if (attempt >= maxAttempts) {
              action = `Not retried: attempt ${attempt} of ${maxAttempts} was the last one allowed.`;
            } else if (prCheckError) {
              action = `Not retried: could not confirm the PR is open (${prCheckError}).`;
            } else if (newerRunError) {
              action = `Not retried: could not check for a newer run (${newerRunError}).`;
            } else if (newerRun) {
              action = `Not retried: superseded by [run ${newerRun.id}](${newerRun.html_url}).`;
            } else if (prState && prState !== 'open') {
              action = `Not retried: PR #${pr.number} is ${prState}.`;
            } else {
              try {
                await github.rest.actions.reRunWorkflowFailedJobs({ owner, repo, run_id: run.id });
                action = `Re-ran failed jobs as attempt ${attempt + 1} of ${maxAttempts}.`;
              } catch (error) {
                rerunError = error;
                action = `Re-run request failed: ${error.message}`;
              }
            }

            const runUrl = `${run.html_url}/attempts/${attempt}`;
            const jobLines = lost.map(j => `- [${j.name}](${j.html_url}) on runner \`${j.runner_name || 'unknown'}\``);
            const prLink = pr ? `, PR #${pr.number}` : '';
            const header = `**${run.name}** on \`${run.head_branch}\` (${run.event}${prLink}), [attempt ${attempt}](${runUrl})`;
            const body = [header, '', 'Runner lost communication in:', ...jobLines, '', action].join('\n');

            await core.summary.addRaw(body).write();

            let issueError = null;
            try {
              const { data: openIssues } = await github.rest.issues.listForRepo({
                owner, repo, state: 'open', labels: process.env.TRACKING_ISSUE_LABEL, per_page: 1,
              });
              if (openIssues.length > 0) {
                await github.rest.issues.createComment({ owner, repo, issue_number: openIssues[0].number, body });
              } else {
                await github.rest.issues.create({
                  owner, repo,
                  title: process.env.TRACKING_ISSUE_TITLE,
                  labels: [process.env.TRACKING_ISSUE_LABEL],
                  body: [
                    'Each comment records a CI job whose self-hosted runner lost communication with GitHub.',
                    'Subscribe to this issue to be notified. Close it to start a fresh one on the next event.',
                    '',
                    '---',
                    '',
                    body,
                  ].join('\n'),
                });
              }
            } catch (error) {
              issueError = error;
              core.error(`Tracking issue update failed: ${error.message}`);
            }

            if (process.env.SLACK_WEBHOOK_URL) {
              const slackJobs = lost.map(j => `• <${j.html_url}|${j.name}> on \`${j.runner_name || 'unknown'}\``);
              const text = [
                `:warning: CI runner lost communication: *${run.name}* on \`${run.head_branch}\`${prLink}, <${runUrl}|attempt ${attempt}>`,
                ...slackJobs,
                action,
              ].join('\n');
              try {
                const response = await fetch(process.env.SLACK_WEBHOOK_URL, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({ text }),
                });
                if (!response.ok) {
                  core.warning(`Slack notification failed: HTTP ${response.status}`);
                }
              } catch (error) {
                core.warning(`Slack notification failed: ${error.message}`);
              }
            }

            if (rerunError) {
              core.setFailed(action);
            } else if (issueError) {
              core.setFailed(`Tracking issue update failed: ${issueError.message}`);
            }
